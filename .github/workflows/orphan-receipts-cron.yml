name: Orphan receipt sweep

on:
  schedule:
    # Daily 03:00 HKT (19:00 UTC) — deletes OCR uploads unreferenced for 48+ hours.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (log orphans, do not delete)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      min_age_hours:
        description: 'Minimum file age in hours before deletion'
        required: false
        default: '48'

jobs:
  orphan-receipt-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep unreferenced receipt uploads
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          MIN_AGE_HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.min_age_hours || '48' }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secrets: APP_URL and/or CRON_SECRET"
            exit 1
          fi
          BASE="${APP_URL%/}"
          HTTP_CODE=$(curl -sS -o /tmp/orphan-sweep-body.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron/orphan-receipts?dry_run=${DRY_RUN}&min_age_hours=${MIN_AGE_HOURS}")
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/orphan-sweep-body.json
          echo
          case "${HTTP_CODE}" in
            2??) ;;
            *)
              echo "Orphan receipt sweep failed with HTTP ${HTTP_CODE}"
              exit 1
              ;;
          esac
